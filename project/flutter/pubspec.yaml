name: star_tower
description: 星穹塔，50 层原创魔塔冒险 Flutter 版。
publish_to: none
version: 1.0.5+5
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.0.10+1
  shared_preferences: 2.2.3
  audioplayers: 5.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/game.json
    - assets/data/translations.json
    - assets/fonts/tower-chinese.otf
    - assets/fonts/OFL.txt
    - assets/images/bg/
    - assets/images/hero/
    - assets/images/items/
    - assets/images/monsters/
    - assets/images/tiles/
    - assets/images/ui/
    - assets/images/pixel/hero/
    - assets/images/pixel/items/
    - assets/images/pixel/monsters/
    - assets/images/pixel/tiles/
    - assets/audio/
  fonts:
    - family: Tower Japanese
      fonts:
        - asset: assets/fonts/tower-japanese.otf
