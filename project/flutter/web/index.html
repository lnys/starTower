<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; background: #0d0b16; }
    #game-host { width: 25vw; height: 80vh; margin: 10vh auto; touch-action: pan-x pan-y; }
  </style>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="50 层原创魔塔冒险">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="星穹塔">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>星穹塔</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="game-host"></div>
  <script>
    document.addEventListener('wheel', (event) => {
      if (event.ctrlKey || event.metaKey) event.preventDefault();
    }, {passive: false});
    document.addEventListener('keydown', (event) => {
      if ((event.ctrlKey || event.metaKey) && ['+', '-', '=', '0'].includes(event.key)) event.preventDefault();
    });
    document.addEventListener('gesturestart', (event) => event.preventDefault(), {passive: false});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
